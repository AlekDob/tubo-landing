<!-- Tubo "Capsule": a tilted glass capsule (the tube) with red light settled at the bottom. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a52"/>
      <stop offset="1" stop-color="#e5281d"/>
    </linearGradient>
    <clipPath id="shape"><rect x="22" y="6" width="20" height="52" rx="10"/></clipPath>
  </defs>
  <g transform="rotate(35 32 32)">
    <rect x="22" y="6" width="20" height="52" rx="10" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28"/>
    <rect x="22" y="32" width="20" height="26" fill="url(#liquid)" clip-path="url(#shape)"/>
    <path d="M27 14v12" stroke="#fff" stroke-opacity=".7" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
